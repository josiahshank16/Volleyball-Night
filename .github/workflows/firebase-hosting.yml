name: Publish Volleyball Night to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volleyball-night-firebase-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build website
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build
      - name: Verify Firebase deployment credential exists
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLLEYBALL_NIGHT }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS" ]; then
            echo "::error::Firebase Hosting has NOT been updated. Set GitHub Actions repository secret FIREBASE_SERVICE_ACCOUNT_VOLLEYBALL_NIGHT. Run 'npx --yes firebase-tools@latest init hosting:github' once in your Codespace to create the credential and GitHub secret."
            exit 1
          fi
          echo "Firebase deployment credential is configured."
      - name: Deploy verified build to the live Firebase Hosting site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLLEYBALL_NIGHT }}
          projectId: volleyball-night
          channelId: live
