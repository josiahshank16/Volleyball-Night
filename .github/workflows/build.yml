name: Check app builds
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/test-player-groups.mjs
      - run: node scripts/test-organizer-flow.mjs
      - run: npm run build
      - name: Summarize npm security advisories (informational)
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node -e '
            const r = require("./audit-report.json");
            console.log("npm audit summary:", JSON.stringify(r.metadata?.vulnerabilities || {}));
            for (const [name, issue] of Object.entries(r.vulnerabilities || {})) {
              console.log(issue.severity + ": " + name + " | fix available: " + JSON.stringify(issue.fixAvailable));
            }
          '
          rm -f audit-report.json
